name: Build and Release

# 修改触发条件：每次推送代码时都触发
on:
  push:
    branches:
      - '*'  # 监听所有分支的推送
    tags:
      - '*'  # 同时监听所有标签的推送

env:
  APP_NAME: ntp-server
  BUILD_DIR: build

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: ntp-server-linux
          - os: windows
            arch: amd64
            output: ntp-server-windows.exe
          - os: darwin
            arch: amd64
            output: ntp-server-mac
          - os: darwin
            arch: arm64
            output: ntp-server-mac-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        OUTPUT_FILE: ${{ matrix.output }}
        VERSION: ${{ github.sha }}  # 使用提交哈希作为版本号
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        go build -ldflags "\
          -X main.Version=$VERSION \
          -X main.Commit=$COMMIT \
          -X main.Date=$BUILD_DATE" \
          -o ${{ env.BUILD_DIR }}/$OUTPUT_FILE main.go
        echo "Built $OUTPUT_FILE for $GOOS/$GOARCH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ${{ env.BUILD_DIR }}/${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ env.BUILD_DIR }}

    - name: Prepare release assets
      run: |
        cd ${{ env.BUILD_DIR }}
        for d in */; do
          cp -r "${d}"* .
          rm -rf "$d"
        done
        find . -type d -empty -delete
        ls -lh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: auto-build-${{ github.sha }}  # 使用提交哈希创建唯一标签
        name: Auto Build ${{ github.sha }}
        body: |
          Automatic build from commit ${{ github.sha }}
          Triggered by push to branch ${{ github.ref_name }}
        files: ${{ env.BUILD_DIR }}/*
        draft: false
        prerelease: true  # 标记为预发布版本
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}