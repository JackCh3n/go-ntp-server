name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  APP_NAME: ntp-server
  BUILD_DIR: build

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: ntp-server-linux-amd64
          - os: windows
            arch: amd64
            output: ntp-server-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: ntp-server-darwin-amd64
          - os: darwin
            arch: arm64
            output: ntp-server-darwin-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史记录，用于版本信息

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        OUTPUT_FILE: ${{ matrix.output }}
        VERSION: ${{ github.sha }}
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.repository.updated_at }}
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        go build -ldflags "\
          -X 'main.Version=$VERSION' \
          -X 'main.Commit=$COMMIT' \
          -X 'main.Date=$BUILD_DATE'" \
          -o ${{ env.BUILD_DIR }}/$OUTPUT_FILE main.go
        echo "Built $OUTPUT_FILE for $GOOS/$GOARCH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ${{ env.BUILD_DIR }}/${{ matrix.output }}
        
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # 修改触发条件：在推送到 main 分支时创建发布，同时保留标签推送时创建正式发布的能力
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -type f -exec cp {} release-assets \;
        ls -lh release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        # 根据触发源决定标签名：标签推送用标签名，main 分支推送用提交 SHA
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        # 根据触发源决定发布名称
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Auto Build from main ({0})', github.sha) }}
        body: |
          ## Automated Build
          - **Trigger**: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag Push' || 'Main Branch Push' }}
          - **Ref**: ${{ github.ref }}
          - **Commit**: ${{ github.sha }}
          - **Built by**: ${{ github.actor }}
          - **Build Time**: ${{ github.event.repository.updated_at }}
          
          ## Assets
          This release contains binaries for multiple platforms.
        files: release-assets/*
        draft: false
        # 如果是 main 分支推送，标记为预发布版本；标签推送则为正式发布
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
