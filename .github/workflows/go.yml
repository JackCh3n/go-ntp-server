name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  APP_NAME: ntp-server
  BUILD_DIR: build

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: ntp-server-linux-amd64
          - os: windows
            arch: amd64
            output: ntp-server-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: ntp-server-darwin-amd64
          - os: darwin
            arch: arm64
            output: ntp-server-darwin-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        OUTPUT_FILE: ${{ matrix.output }}
        VERSION: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        go build -ldflags "\
          -X 'main.Version=$VERSION' \
          -X 'main.Commit=$COMMIT' \
          -X 'main.Date=$BUILD_DATE'" \
          -o ${{ env.BUILD_DIR }}/$OUTPUT_FILE main.go
        echo "Built $OUTPUT_FILE for $GOOS/$GOARCH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ${{ env.BUILD_DIR }}/${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -type f -exec cp {} release-assets \;
        ls -lh release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this release
          - Fixed timestamp handling in NTP responses
          - Improved GitHub Actions workflow
          - Enhanced logging for debugging
          
          ## Build Information
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Built by**: ${{ github.actor }}
        files: release-assets/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}