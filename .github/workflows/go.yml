name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - '*'

env:
  APP_NAME: ntp-server
  BUILD_DIR: build

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: ntp-server-linux
          - os: windows
            arch: amd64
            output: ntp-server-windows.exe
          - os: darwin
            arch: amd64
            output: ntp-server-mac
          - os: darwin
            arch: arm64
            output: ntp-server-mac-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Initialize Go module
      run: |
        go mod init github.com/yourusername/ntp-server
        go mod tidy

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        OUTPUT_FILE: ${{ matrix.output }}
        VERSION: ${{ github.sha }}
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
      run: |
        mkdir -p ${{ env.BUILD_DIR }}
        go build -ldflags "\
          -X 'main.Version=$VERSION' \
          -X 'main.Commit=$COMMIT' \
          -X 'main.Date=$BUILD_DATE'" \
          -o ${{ env.BUILD_DIR }}/$OUTPUT_FILE main.go
        echo "Built $OUTPUT_FILE for $GOOS/$GOARCH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ${{ env.BUILD_DIR }}/${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ env.BUILD_DIR }}

    - name: Prepare release assets
      run: |
        cd ${{ env.BUILD_DIR }}
        for d in */; do
          cp -r "${d}"* .
          rm -rf "$d"
        done
        find . -type d -empty -delete
        ls -lh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: auto-build-${{ github.sha }}
        name: Auto Build ${{ github.sha }}
        body: |
          Automatic build from commit ${{ github.sha }}
          Triggered by push to branch ${{ github.ref_name }}
          
          ## Build Information
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Triggered by**: ${{ github.actor }}
        files: ${{ env.BUILD_DIR }}/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}