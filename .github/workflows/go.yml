name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 格式的标签时触发

env:
  APP_NAME: ntp-server
  BUILD_DIR: build

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: ${{ env.APP_NAME }}-linux
          - os: windows
            arch: amd64
            output: ${{ env.APP_NAME }}-windows.exe
          - os: darwin
            arch: amd64
            output: ${{ env.APP_NAME }}-mac
          - os: darwin
            arch: arm64
            output: ${{ env.APP_NAME }}-mac-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'  # 根据项目需求调整版本

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        OUTPUT: ${{ matrix.output }}
      run: |
        mkdir -p $BUILD_DIR
        go build -o $BUILD_DIR/$OUTPUT main.go
        echo "Built $OUTPUT for $GOOS/$GOARCH"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: ${{ env.BUILD_DIR }}/${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来创建 Release
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ env.BUILD_DIR }}

    - name: Prepare release assets
      run: |
        cd $BUILD_DIR
        for dir in */; do
          cp "${dir}"* .
          rm -r "$dir"
        done
        ls -lh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.BUILD_DIR }}/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
